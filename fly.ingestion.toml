# Standalone Fly app config for cmd/ingestion-service, the issuer-facing
# half of the split described in docs/design.md §15.1/§15.5 — see
# fly.as.toml's header comment for the four-app convention this follows.
#
# Single shard ("default") for this prototype deployment — see
# docs/design.md §15.5 for how a second shard would add its own
# REDIS_ADDR/SHARD_ID and a second app (e.g. siros-status-service-ingestion-b).
#
# BASE_URL is deliberately the *verifier* service's public URL, not this
# app's own: internal/ingestion/handlers.go builds POST /allocate's
# `list_url` response field from it, and that URL is what verifiers later
# fetch — see README.md's local walkthrough for the same pattern.
#
# Required secrets before first deploy:
#   fly secrets set -a siros-status-service-ingestion \
#     DATABASE_URL="postgres://...same Postgres as -as and -verifier..." \
#     REDIS_URL="redis://...this shard's Redis..." \
#     SIGNING_KEY_PEM="$(openssl ecparam -name prime256v1 -genkey -noout)"
#       # ^ StatusListToken signing key — must be the SAME value set on
#       #   siros-status-service-verifier's SIGNING_KEY_PEM secret.

app = "siros-status-service-ingestion"
primary_region = "arn"

[build]

[env]
  HTTP_ADDR = ":8080"
  BASE_URL = "https://siros-status-service-verifier.fly.dev"
  SHARD_ID = "default"
  AS_JWKS_URL = "https://siros-status-service-as.fly.dev/.well-known/jwks.json"
  ACCESS_TOKEN_ISSUER = "https://siros-status-service-as.fly.dev"

[processes]
  app = "/usr/local/bin/ingestion-service"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
