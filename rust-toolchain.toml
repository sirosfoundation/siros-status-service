# Exact toolchain pin for the rust/ workspace. This file is the single source
# of truth: rustup uses it for every local `cargo`/`rustc` (it is found by
# searching upward from rust/), and CI installs from it through
# .github/actions/rust-toolchain, so a local build and a CI build run the same
# compiler. It lives at the repository root, not in rust/, because the root is
# where the composite action and Dependabot look; the rest of the repo is Go.
#
# Why exact: a floating `stable` changes the compiler under us on every Rust
# release, so new default lints can turn `-D warnings` red without a commit.
#
# To bump: change `channel` (Dependabot's `rust-toolchain` ecosystem opens this
# PR monthly) and run fmt, clippy and the tests.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["wasm32-wasip1"]
