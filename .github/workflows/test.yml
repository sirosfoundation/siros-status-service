on: [push, pull_request]
name: Test
permissions: write-all
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
         go-version-file: go.mod
    - name: verify the static production build (CGO_ENABLED=0, matches Dockerfile — docs/design.md §26)
      run: CGO_ENABLED=0 GOOS=linux GOWORK=off go build ./...
    - name: run tests
      run: make test
    - name: generate test coverage
      run: go test ./... -coverprofile=./cover.out -covermode=atomic -coverpkg=./...
    - name: check test coverage
      uses: vladopajic/go-test-coverage@v2
      with:
        debug: true
        config: ./.testcoverage.yml
        git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
        git-branch: badges
    - name: Check docs/CONFIGURATION.md is up to date
      run: |
        make gen-config-docs
        if [ -n "$(git status --porcelain -- docs/CONFIGURATION.md)" ]; then
          git diff -- docs/CONFIGURATION.md || true
          echo "::error::docs/CONFIGURATION.md is out of date. Run 'make gen-config-docs' and commit the result."
          exit 1
        fi
    - name: install SoftHSM2 (for the -tags pkcs11 build's real HSM integration test, docs/design.md §26)
      run: sudo apt-get update && sudo apt-get install -y softhsm2 opensc
    - name: verify the -tags pkcs11 build (CGO_ENABLED=1, a real HSM deployment's own separate build)
      run: CGO_ENABLED=1 GOWORK=off go build -tags pkcs11 ./...
    - name: run -tags pkcs11 tests (internal/signing only — the rest of the repo doesn't change under this tag)
      run: CGO_ENABLED=1 GOWORK=off go test -tags pkcs11 -race ./internal/signing/...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
         go-version-file: go.mod
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
    - name: golangci-lint (-tags pkcs11)
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --build-tags=pkcs11
