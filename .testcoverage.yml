profile: cover.out
threshold:
  file: 70
  package: 70
  total: 55
exclude:
  paths:
    - ^cmd/                               # entry points — not unit-testable
    - ^internal/store/                    # Postgres/Redis clients — need live infra, not yet covered
    - ^internal/ingestion/                # HTTP handlers wiring store+pool+publisher — same reason
    - ^internal/verifier/                 # same reason
    - ^internal/as/                       # AS server/handlers/shard assignment — needs live Postgres+HTTP
    - ^internal/pgutil/                   # advisory-locked DDL helper — needs live Postgres
    - ^internal/publisher/publisher\.go$   # orchestrates store + signing — needs live infra, same reason.
                                           # debounce.go (the leadingDebouncer coalescing logic, §9) is
                                           # pure and fully unit-tested, so it's NOT excluded here.
    - ^internal/config/                   # thin env-var loader, low value to unit test in isolation
    - ^internal/gc/                       # archive/purge sweep — needs live Postgres/Redis, same reason
override:
  # internal/pool's pure selection logic (ChooseByPowerOfTwo) is fully
  # tested; Manager's methods (EnsureHealthy, PickForAllocation, Run,
  # createList) need live Postgres/Redis like the excluded packages above,
  # and share a file with the tested logic, so both the package and its
  # one file get a reduced threshold instead of a blanket exclude.
  - threshold: 15
    path: ^internal/pool$
  - threshold: 15
    path: ^internal/pool/pool\.go$
