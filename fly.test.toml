# Throwaway test deployment — separate app from fly.toml's
# "siros-status-service" so exploratory testing never touches the
# canonical production app name/config (mirrors go-zk-circuits'
# fly.toml / fly.test.toml split). No client auth is configured
# (ISSUER_API_KEYS left unset — see internal/api/auth.go's no-auth mode):
# fine for a disposable test instance, never for anything real.

app = "siros-status-service-test"
primary_region = "arn"

[build]

[env]
  BASE_URL = "https://siros-status-service-test.fly.dev"
  HTTP_ADDR = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
