# Standalone Fly app config for cmd/ingress-router, the JWT-claim-routing
# layer described in docs/design.md §15.6 — see fly.as.toml's header
# comment for the four-app convention this follows. This is the one URL
# issuers actually POST/PATCH against; it verifies their access token
# offline (same AS JWKS every other consumer trusts) and proxies to the
# shard named by the token's tenant_id claim.
#
# No DATABASE_URL/secrets needed — this app holds no state and never
# calls the AS synchronously (docs/design.md §15.3: it only fetches and
# caches the AS's JWKS, same as -ingestion).

app = "siros-status-service-ingress"
primary_region = "arn"

[build]

[env]
  HTTP_ADDR = ":8080"
  AS_JWKS_URL = "https://siros-status-service-as.fly.dev/.well-known/jwks.json"
  ACCESS_TOKEN_ISSUER = "https://siros-status-service-as.fly.dev"
  # shard_id -> that shard's ingestion-service base URL (docs/design.md
  # §15.5/§15.6). Add an entry per shard as more are introduced.
  SHARD_BACKENDS = '{"default":"https://siros-status-service-ingestion.fly.dev"}'

[processes]
  app = "/usr/local/bin/ingress-router"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
