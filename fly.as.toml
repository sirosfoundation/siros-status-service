# Standalone Fly app config for cmd/as, the Authorization Server
# (docs/design.md §15.2) — one of this repo's Fly apps, all built from the
# same image (see fly.ingestion.*.toml, fly.verifier.toml,
# fly.ingress.*.toml), following this org's convention that every
# standalone Go service ships its own fly.toml rather than being
# orchestrated through sirosid-dev (see go-zk-circuits/fly.toml).
# README.md "Deploying to Fly" has the one-time setup and deploy order.
#
# docs/design.md §18: this app, cmd/verifier-service, and the shared
# Postgres primary all live in `iad` — the "central" region every shard
# talks to regardless of where its own ingestion-service/Redis are.
#
# Public *.fly.dev hostnames are deterministic from each app's fixed
# name, so cross-app URLs (AS_JWKS_URL, ACCESS_TOKEN_ISSUER,
# SHARD_BACKENDS, ...) are hardcoded as plain env vars in each file — no
# dependency-injection/render step needed.
#
# Custom domain: auth.t.status.siros.org (docs/design.md §18 originally
# deferred this — cmd/as kept its bare *.fly.dev hostname while that
# stayed "a real open question worth deciding separately" — now decided).
# BASE_URL above drives both the `iss` claim on every issued access token
# and the required `aud` on incoming client assertions, so every consumer
# that hardcodes the AS's identity (fly.ingress.toml's and each
# fly.ingestion.<region>.toml's AS_JWKS_URL/ACCESS_TOKEN_ISSUER) must be
# updated and redeployed in the same pass as this one, not independently.
# One-time setup:
#   fly certs add auth.t.status.siros.org -a siros-status-service-as
# then follow the printed DNS instructions.
#
# Required secrets before first deploy:
#   fly secrets set -a siros-status-service-as \
#     DATABASE_URL="postgres://...shared with every -ingestion-<region> and -verifier..." \
#     AS_SIGNING_KEY_PEM="$(openssl ecparam -name prime256v1 -genkey -noout)"

app = "siros-status-service-as"
primary_region = "iad"

[build]

[env]
  HTTP_ADDR = ":8080"
  BASE_URL = "https://auth.t.status.siros.org"
  # One shard per region (docs/design.md §18) — AssignOrLookup round-robins
  # new issuers across these two, sticky thereafter. Add a region here (and
  # a matching fly.ingestion.<region>.toml + fly.ingress.<region>.toml pair)
  # to add a shard.
  SHARDS = "iad,fra"
  # Unset here: AllowAllEvaluator, fail-open (docs/design.md §15.2) — fine
  # for this prototype, never for a real deployment. Set to a live
  # go-trust PDP's base URL for real, fail-closed AuthZEN trust evaluation:
  # TRUST_PDP_URL = "https://pdp.example.org"

[processes]
  app = "/usr/local/bin/as"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
