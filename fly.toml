# Standalone Fly app config, following this org's convention that every
# standalone Go service ships its own fly.toml rather than being
# orchestrated through sirosid-dev (see go-zk-circuits/fly.toml).
#
# Phase 1 deployment from docs/design.md §12: a single app, single Redis
# (`fly redis create` or Upstash) and single Postgres (`fly postgres
# create`), attached via REDIS_ADDR / DATABASE_URL secrets. Set
# SIGNING_KEY_PEM and ISSUER_API_KEYS as secrets too — never in this file.

app = "siros-status-service"
primary_region = "arn"

[build]

[env]
  BASE_URL = "https://siros-status-service.fly.dev"
  HTTP_ADDR = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
